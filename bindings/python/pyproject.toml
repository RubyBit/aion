[build-system]
requires = [
  "setuptools>=82",
  "wheel",
  "cffi>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
description = "Python bindings for the Aion runtime (via C ABI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Angelos-Ermis Mangos" }]
keywords = ["inference", "tensor", "zig", "ffi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "cffi>=2.0",
]
dynamic = ["version"]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
# GPU support: the published `aion` wheels already contain the GPU backend (the
# seam is compiled in), but link NO wgpu — it is loaded at runtime via dlopen.
# `pip install aion[gpu]` pulls the `aion-wgpu` companion, which ships just the
# wgpu-native runtime library; `aion`'s package __init__ then points the loader
# at it. The marker skips the one target wgpu-native ships no prebuilt for
# (linux/aarch64), where `aion[gpu]` stays CPU-only rather than failing to
# resolve. `aion-wgpu` is versioned after the wgpu-native release it wraps.
gpu = ["aion-wgpu>=29.0.4,<30; sys_platform != 'linux' or platform_machine != 'aarch64'"]

# PEP 735 dependency groups: local dev/test environments, not package extras.
# `uv sync` installs the `dev` group by default; use `--group test` for just the
# test deps, or `--no-default-groups` for a runtime-only environment.
[dependency-groups]
# numpy: the test fixtures build synthetic .aion packages via the C-ABI Builder.
test = ["pytest>=9", "numpy>=1.26"]
# Type-check only: PEP 696 TypeVar defaults are not in 3.12's `typing`.
typing = ["typing-extensions>=4.12"]
dev = [
  "aion-wgpu>=29.0.4,<30; sys_platform != 'linux' or platform_machine != 'aarch64'",
  "pyright>=1.1",
  "typing-extensions>=4.12",  # PEP 696 TypeVar defaults, for type-checking only
  "tokenizers>=0.23.1",
  "pytest>=9",
  "numpy>=1.26",
  "torch>=2.2",
  "safetensors>=0.4",  # gemma/silero converters read safetensors checkpoints
  "sentencepiece>=0.2",
  "pyyaml>=6",
  "soundfile>=0.12",
  "sounddevice>=0.4",  # microphone capture for the mic example
]

# Persistent native-build switches for these bindings (read by tools/build_zig.py).
# `gpu = true` compiles the wgpu-native GPU backend (the "seam") into the extension.
# No wgpu is linked or bundled — it is loaded at runtime via dlopen — so this only
# controls whether GPU code is present; the wgpu runtime itself comes from the
# `aion-wgpu` package (`aion[gpu]`). Under uv the build cache is env-blind, so this
# pyproject switch — not just `AION_PY_GPU` — is what reliably (re)builds with the
# seam. `AION_PY_GPU` still overrides it (set `0` for a smaller CPU-only extension,
# e.g. the linux/aarch64 wheel that has no wgpu prebuilt).
[tool.aion]
gpu = true

# Dev-only: resolve the optional GPU runtime companion from the sibling directory
# so the default development environment and `uv sync --extra gpu` work from a
# repo checkout before it is published.
# Ignored by pip/build (they read it from PyPI); does not affect published wheels.
[tool.uv.sources]
aion-wgpu = { path = "aion-wgpu" }

[tool.uv]
# The native extension is built from the repository's Zig core, outside this
# Python project. uv normally keys a local build only on pyproject.toml/setup.py,
# which can restore stale native bytes after a core edit. Include every native
# build input so a normal `uv run ...` rebuilds the editable package when needed.
# Do not include generated `_aion_cffi` binaries here: build outputs must not
# invalidate their own cache key.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "setup.py" },
  { file = "tools/**/*.py" },
  { file = "src/aion/_ffi/build.py" },
  { file = "src/aion/_ffi/aion_ffi.h" },
  { file = "../../build.zig" },
  { file = "../../build.zig.zon" },
  { file = "../../include/**/*.h" },
  { file = "../../src/**/*.zig" },
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "aion.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The compiled extension module and typing/stub metadata. No wgpu runtime is
# bundled here — it ships in the `aion-wgpu` package and is loaded at runtime.
aion = ["py.typed", "*.pyi", "*.so", "*.dylib", "*.pyd", "_ffi/*.h"]

[tool.pyright]
include = [
  "src/aion",
  "type_tests",
  "tests",
  "examples",
  "../../scripts/convert_gemma4_e2b_to_aion.py",
  "../../scripts/convert_nemotron_asr_to_aion.py",
]
exclude = [
  "src/aion/_ffi/build.py",
  "build",
  ".venv",
]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/aion/_ffi", "type_tests"]
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "warning"

# ── Wheel building (see .github/workflows/publish.yml) ──────────────────────
# Each wheel embeds the statically-linked Aion runtime + the GPU seam (which
# loads wgpu-native at runtime via dlopen — nothing wgpu is linked or bundled).
# On targets with no wgpu-native prebuilt (linux/aarch64), build.zig degrades to
# a CPU-only build automatically, and the `aion[gpu]` extra skips `aion-wgpu`.
[tool.cibuildwheel]
build = "cp312-* cp313-*"
skip = "*-musllinux_*" # musl would need a separate in-container Zig; manylinux only.
build-frontend = "build"
# Sanity-check the wheel imports on the target interpreter (no GPU runtime here,
# so this exercises the CPU path and the graceful "no wgpu" fallback).
test-command = "python -c \"import aion; print('aion', aion.__version__)\""

[tool.cibuildwheel.environment]
AION_PY_GPU = "1"          # compile the GPU seam where a wgpu prebuilt exists
AION_PY_MULTIVERSION = "1" # portable CPU: runtime CPUID dispatch, one wheel fits all
AION_PY_CPU = "baseline"   # conservative ISA floor for the main module

# Linux wheels build in a manylinux container. Zig is installed on the host
# (mlugg/setup-zig) and the host filesystem is visible at /host, so point the
# build at the host zig rather than installing it inside the container.
[tool.cibuildwheel.linux]
environment-pass = ["HOST_ZIG"]

[tool.cibuildwheel.linux.environment]
AION_PY_GPU = "1"
AION_PY_MULTIVERSION = "1"
AION_PY_CPU = "baseline"
AION_ZIG_EXE = "/host$HOST_ZIG"
