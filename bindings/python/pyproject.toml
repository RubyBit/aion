[build-system]
requires = [
  "setuptools>=82",
  "wheel",
  "cffi>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
description = "Python bindings for the Aion runtime (via C ABI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Angelos-Ermis Mangos" }]
keywords = ["inference", "tensor", "zig", "ffi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "cffi>=2.0",
]
dynamic = ["version"]

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
test = ["pytest>=9"]
dev = [
  "pytest>=9",
  "numpy>=1.26",
  "torch>=2.2",
  "sentencepiece>=0.2",
  "pyyaml>=6",
  "soundfile>=0.12",
  "sounddevice>=0.4",  # microphone capture for the mic example
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "aion.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Native artifact(s) and typing/stub metadata.
aion = ["py.typed", "*.pyi", "*.so", "*.dylib", "*.pyd", "_ffi/*.h"]
